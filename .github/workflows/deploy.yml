# This is a basic workflow to help you get started with Actions

name: Push To MC Server

# Controls when the workflow will run
on:
  # Triggers the workflow on push
  push:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  deploy:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Send initial message
        uses: wolfigster/rcon-action@v1.0.2
        with:
          server: ${{ secrets.MC_IP }}
          port: '8106'
          password: ${{ secrets.RCON_PASSWORD }}
          commit_msg: ${{ github.event.head_commit.message || github.event.workflow_run.head_commit.message || github.event.pull_request.title || github.sha }}
          commands: '["say Uploading datapack files: [${{github.event.inputs.commit_msg}}]"]'

      # Uploads the `data` directory to the server via SFTP with host key verification disabled
      - name: Upload data directory
        uses: milanmk/actions-file-deployer@1.17
        with:
          remote-protocol: 'sftp'
          remote-host: ${{ secrets.SFTP_IP }}
          remote-user: ${{ secrets.SFTP_USERNAME }}
          remote-password: ${{ secrets.SFTP_PASSWORD }}
          remote-port: '2222'
          local-path: 'data/*'
          remote-path: '/world/datapacks/disaster-game/data'
              
      - name: Reload MC server
        uses: wolfigster/rcon-action@v1.0.2
        with:
          server: ${{ secrets.MC_IP }}
          port: '8106'
          password: ${{ secrets.RCON_PASSWORD }}
          commands: '["say Datapack updated! Reloading...", "reload"]'
